<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student-Form</title>
  </head>
  <body>
    <form>
      <label for="fname">First Name (required):</label>
      <input id="fname" name="fname" /> <br />
      <label for="lname">Last Name (required):</label>
      <input id="lname" name="lname" /><br />
      <label for="age">Age (required):</label>
      <input id="age" name="age" /> <br />
      <label for="course">Course (required):</label>
      <input id="course" name="course" /> <br />
      <label for="score">Score (required):</label>
      <input id="score" name="score" /> <br />
      <div><button>Add Student</button></div>
    </form>
  </body>
</html>
