<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student_DB</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <h1>Student DB</h1>
    <div id="search-filter">Search and Filter</div>
    <div id="form">
      <a href="./form.html">Add student</a>
    </div>
    <div id="stats">
      <div>
        Total Students
        <span id="stat_total">X</span>
      </div>
      <div>
        Average Score
        <span id="stat_avg">X</span>
      </div>
      <div>
        Highest Score
        <span id="stat_high">X</span>
      </div>
      <div>
        No of Passed Students
        <span id="stat_passed">X</span>
      </div>
    </div>

    <div id="records">
      <h4>Records</h4>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
            <th>Score</th>
            <th></th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
